name: CI

# Verificacao local do projeto: sintaxe, testes de verificacao, geracao dos
# artefatos derivados e idempotencia do build.
#
# Nenhum passo aqui fala com a rede dos provedores de OSINT: os testes usam
# fixtures offline. Nenhum passo publica nada.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificacao local (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 e o minimo do projeto: `node:sqlite`, o armazenamento local do
      # limite de login (scripts/lib/guard-local.mjs), so existe a partir do
      # Node 22.5. No Node 20 o `import { DatabaseSync } from 'node:sqlite'`
      # quebra com ERR_UNKNOWN_BUILTIN_MODULE e nenhum check chega a rodar.
      #
      # O Node 20 esta em EOL desde abril de 2026: nao ha manutencao nem
      # correcao de seguranca para ele.
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Checar sintaxe de todos os modulos (Worker e variante Netlify)
        run: npm run check

      - name: Testes de verificacao (offline)
        run: npm test

      - name: Gerar artefatos derivados (registro e migracoes)
        run: npm run build

      - name: Build idempotente (nada muda depois do build)
        # `git diff --exit-code` sozinho nao basta: ele ignora caminho que nao
        # existe (artefato derivado apagado ou renomeado) e arquivo novo (nao
        # versionado). O check confere os tres artefatos derivados, exige a
        # arvore inteira limpa e roda o build de novo para provar que ele nao
        # muda nada.
        run: npm run check:build
