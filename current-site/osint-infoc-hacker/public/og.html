<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0}
#card{width:1200px;height:630px;position:relative;overflow:hidden;background:#050505;
border:1px solid #2a2320;box-sizing:border-box;
font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e7e6d9}
.glow{position:absolute;inset:0;background:
radial-gradient(58% 78% at 76% 48%,rgba(230,162,116,.30),transparent 70%),
radial-gradient(40% 60% at 74% 48%,rgba(255,219,191,.16),transparent 72%)}
.grid{position:absolute;inset:0;background-image:
repeating-linear-gradient(90deg,transparent 0 47px,rgba(230,162,116,.07) 47px 48px),
repeating-linear-gradient(0deg,transparent 0 47px,rgba(230,162,116,.07) 47px 48px)}
.frame{position:absolute;inset:18px;border:1px solid rgba(231,230,217,.13);border-radius:8px}
.content{position:absolute;left:72px;top:0;bottom:0;width:620px;display:flex;
flex-direction:column;justify-content:center}
.kicker{display:flex;align-items:center;gap:14px;font:11px ui-monospace,Menlo,monospace;
letter-spacing:.26em;color:#9a8f83;margin-bottom:34px}
.line{width:34px;height:1px;background:#e6a274}
h1{margin:0;font:500 78px/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.035em;color:#f4f3ea}
h1 em{font-style:normal;color:#e6a274}
p{margin:28px 0 0;font-size:23px;color:#a09489;letter-spacing:-.01em}
.brand{position:absolute;left:72px;bottom:56px;font:13px ui-monospace,Menlo,monospace;
letter-spacing:.22em;color:#e6a274}
.brand b{color:#7d7269;font-weight:400}
.sphere{position:absolute;right:74px;top:50%;width:330px;height:330px;margin-top:-165px;
border-radius:50%;border:2px solid rgba(255,214,180,.85);
box-shadow:0 0 90px 18px rgba(230,162,116,.42),inset 0 0 70px 12px rgba(230,162,116,.35)}
.sphere i{position:absolute;border-radius:50%;background:#e6a274}
.sphere i:nth-child(1){width:6px;height:6px;top:22px;left:74px;box-shadow:0 0 12px #e6a274}
.sphere i:nth-child(2){width:5px;height:5px;bottom:44px;right:52px;box-shadow:0 0 12px #e6a274}
.sphere i:nth-child(3){width:4px;height:4px;top:190px;left:-16px;box-shadow:0 0 10px #e6a274}
</style></head><body><div id="card">
<div class="glow"></div><div class="grid"></div><div class="frame"></div>
<div class="content">
<div class="kicker"><span class="line"></span>RECONHECIMENTO DIGITAL</div>
<h1>Seu e-mail<br><em>já vazou?</em></h1>
<p>Digite e descubra em segundos.</p>
<div class="brand">OSINT <b>//</b> INFOC.HACKER</div>
</div>
<div class="sphere"><i></i><i></i><i></i></div>
</div></body></html>
